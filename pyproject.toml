[project]
name = "prism-rec"
version = "0.1.0"
description = "PRISM-Rec: a verifiable privacy-preserving social recommendation research harness"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Shivam Agarwal" },
  { name = "Mokshit Jain" },
]
dependencies = [
  "pydantic>=2.9,<3",
  "numpy>=1.26",
  "pandas>=2.1",
  "pandera>=0.18",
  "torch>=2.15.0",
  "sentence-transformers>=6.3.0",
  "scikit-learn>=1.9.1",
  "opacus>=1.6.0",
]

[dependency-groups]
dev = [
  "pip>=24.2",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "ruff>=0.7",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "pip-licenses>=5.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["prism"]

[tool.mypy]
python_version = "3.12"
files = ["src/prism", "scripts"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/prism", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "sklearn.*", "scipy.*", "opacus.*"]
ignore_missing_imports = true
